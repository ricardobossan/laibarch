# Mirrors ~/.config/alacritty/alacritty.toml so kitty feels the same.
# kitty is kept around mainly for its graphics protocol -- `yts` detects it and
# renders real thumbnails instead of chafa symbol art.

font_size 12.5

background_opacity 0.85

# alacritty: selection.save_to_clipboard = true
copy_on_select yes

# alacritty had these bound explicitly; ctrl+shift+c/v are already kitty defaults,
# so only shift+insert needs adding.
map shift+insert paste_from_clipboard

# Keep image previews from being evicted while scrolling a long fzf list.
scrollback_pager_history_size 64
